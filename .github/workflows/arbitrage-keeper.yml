name: V4 arbitrage watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-arbitrage-watcher
  cancel-in-progress: false

jobs:
  watch:
    if: vars.ARBITRAGE_V4_WATCHER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/arbitrage-keeper-v4.mjs --once
        env:
          ARBITRAGE_APP_URL: https://arbitrage-orcin-five.vercel.app
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_FALLBACK_URLS: ${{ secrets.BASE_RPC_FALLBACK_URLS }}
          ARBITRAGE_RPC_PRODUCTION_READY: ${{ vars.ARBITRAGE_RPC_PRODUCTION_READY }}
          NEXT_PUBLIC_ARBITRAGE_EXECUTOR_V4: "0x6Aad2b4BB89813B4E0Db43170c8b314417B1D571"
          ARBITRAGE_V4_KEEPER_POLL_MS: "300000"
